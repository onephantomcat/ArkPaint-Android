[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arkpaint"
version = "0.1.0"
description = "Paint 24x24 palette images on ArkPaint through TCP ADB"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10,<5",
    "Pillow>=10,<12",
    "PySide6>=6.8,<7",
]

[project.gui-scripts]
arkpaint = "arkpaint.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
